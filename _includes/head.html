<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {% if page.title and page.url != '/' %}
    <title>{{ page.title }} — {{ site.title }}</title>
  {% else %}
    <title>{{ site.title }} — {{ site.tagline }}</title>
  {% endif %}

  {% assign desc = page.summary | default: page.description | default: site.description %}
  <meta name="description" content="{{ desc | strip_html | normalize_whitespace | truncate: 200 | escape }}">
  <meta name="author" content="{{ site.author }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">

  <meta property="og:type" content="{% if page.collection == 'articles' %}article{% else %}website{% endif %}">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ desc | strip_html | normalize_whitespace | truncate: 200 | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta name="twitter:card" content="summary">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
