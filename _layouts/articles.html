layout: default
---
<h1>{{ page.title }}</h1>

{{ content }}

{% assign articles = site.articles | sort: 'date' | reverse %}
{% if articles.size == 0 %}
  <p>Nothing published yet. The first one goes in <code>_articles/</code>.</p>
{% else %}
  {% include article-list.html articles=articles %}
{% endif %}
